<!DOCTYPE html>
<html>
<head>
  <title>Task 4 - Even or Odd</title>
</head>
<body>
  <h2>Check Even or Odd</h2>

  <script>
    let num1 = Number(prompt("Enter a number:"));

    if (num1 % 2 === 0) {
      console.log("The number is even");
    } else {
      console.log("The number is odd");
    }
  </script>
</body>
</html>
