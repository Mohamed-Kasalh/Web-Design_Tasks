<!DOCTYPE html>
<html>
<head>
  <title>Task 5 - Nth Root</title>
</head>
<body>
  <h2>Nth Root Calculator</h2>

  <script>
    let x = Number(prompt("Enter the number:"));
    let n = Number(prompt("Enter the root value (n):"));

    let result = x ** (1 / n);

    console.log("The " + n + "th root of " + x + " is " + result);
  </script>
</body>
</html>
